<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="-1">
  <meta http-equiv="CACHE-CONTROL" content="NO-CACHE">
  <title id="main-page-title"></title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/FreeCORE_icon_180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/FreeCORE_icon_32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/FreeCORE_icon_16.png">
  <link rel="manifest" href="assets/manifest.json">
  <meta name="msapplication-TileColor" content="#10151A">
  <meta name="theme-color" content="#10151A">
  <link href="assets/iconfont/material-icons.css" rel="stylesheet" />
  <link href="assets/fonts/text-security/text-security.css" rel="stylesheet" />
</head>
<body class="ix-blue">
  <app-root>
    <main class="fc-status-page"><div class="fc-status-body"><section class="fc-status-panel" aria-labelledby="bootstrap-title"><div class="fc-status-brand"><img src="assets/images/freecore-fork-mark.svg" width="24" height="24" alt=""><span>Free<strong>CORE</strong></span></div><h1 class="fc-status-title" id="bootstrap-title">Loading</h1><div class="fc-status-track indeterminate" role="progressbar" aria-label="Loading"><span></span></div><div class="fc-status-copy" role="status"><p id="bootstrap-message">Opening the web interface.</p></div></section></div><footer class="fc-status-footer"><a href="https://freecore.org" target="_blank" rel="noopener noreferrer">freecore.org</a></footer></main>
    <script>
      try {
        if (sessionStorage.getItem('freecore.uiReloadPending') === '1') {
          sessionStorage.removeItem('freecore.uiReloadPending');
          document.getElementById('bootstrap-title').textContent = 'Reloading';
          document.getElementById('bootstrap-message').textContent = 'Loading the updated web interface.';
          document.querySelector('.fc-status-track').setAttribute('aria-label', 'Reloading');
        }
      } catch (_) {}
    </script>
  </app-root>
</body>
</html>
