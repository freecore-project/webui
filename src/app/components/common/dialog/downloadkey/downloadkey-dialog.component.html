<h2 mat-dialog-title>{{help.downloadkey_dialog_title | translate}}!</h2>
@if (!new) {
  <div mat-dialog-content [innerHtml]='help.downloadkey_dialog_legacy_message | translate'>
  </div>
}
@if (new) {
  <div mat-dialog-content [innerHtml]='help.downloadkey_dialog_zfs_message | translate'>
  </div>
}
<div mat-dialog-actions>
  <button hlmBtn variant="outline" type="button" [disabled]="!new && !isDownloaded" (click)="dialogRef.close(true)"
  ix-auto ix-auto-type="button" ix-auto-identifier="DONE">{{help.downloadkey_dialog_done | translate}}</button>
  <button hlmBtn type="button" cdkFocusInitial (click)="downloadKey()"
  ix-auto ix-auto-type="button" ix-auto-identifier="DOWNLOAD ENCRYPTION KEY">{{help.downloadkey_dialog_button | translate}}</button>
</div>
