<!-- the internal development record: the topbar off mat-toolbar -- the same two boxes (the toolbar, its one row) on .fc-toolbar -->
<div class="topbar lola fc-toolbar fc-toolbar-multiple-rows">
  <div class="fc-toolbar-row">
    <!-- Sidenav toggle button -->
    <button hlmBtn variant="ghost" size="icon-lg" type="button" id="sidenavToggle" (click)="toggleSidenav()" [hlmTooltip]="mat_tooltips.toggle_hide | translate" [attr.aria-label]="mat_tooltips.toggle_hide | translate" position="right"
      ix-auto ix-auto-type="button" ix-auto-identifier="sidenavToggle">
      <mat-icon>menu</mat-icon>
    </button>
    <!-- Sidenav toggle collapse -->
    @if (sidenav.opened) {
      <button hlmBtn variant="ghost" size="icon-lg" type="button" id="collapseToggle" (click)="toggleCollapse()" [hlmTooltip]="mat_tooltips.toggle_collapse | translate" [attr.aria-label]="mat_tooltips.toggle_collapse | translate" class="toggle-collapsed"
        ix-auto ix-auto-type="button" ix-auto-identifier="collapseToggle">
        <mat-icon>chevron_left</mat-icon>
      </button>
    }
    @if (hostname) {
      <span class="fc-hostname" [hlmTooltip]="hostname">{{hostname}}</span>
    }
    <span class="topbar-spacer"></span>

    <!-- identity mark (the internal development record): where 13.3 kept the iX logo; opens About -->
    <button hlmBtn variant="ghost" size="icon-lg" type="button" id="fc-mark" [hlmTooltip]="mat_tooltips.about | translate" [attr.aria-label]="mat_tooltips.about | translate" (click)="onShowAbout()" class="topbar-button-right"
      ix-auto ix-auto-type="button" ix-auto-identifier="fcMark">
      <img class="fc-topbar-mark" [src]="mascot === 'FreeCORE_mascot.png' ? 'assets/images/freecore-fork-mark.svg' : 'assets/images/' + mascot" [class.fc-fork-mark]="mascot === 'FreeCORE_mascot.png'" alt="FreeCORE">
    </button>
    <!--loading icon-->
    @if (updateIsRunning) {
      <button hlmBtn variant="ghost" size="icon-lg" type="button" id="update-running" [hlmTooltip]="mat_tooltips.update | translate" [attr.aria-label]="mat_tooltips.update | translate" (click)="showUpdateDialog()" class="topbar-button-right"
        ix-auto ix-auto-type="button" ix-auto-identifier="updateRunning">
        <mat-icon class="movement">system_update_alt</mat-icon>
      </button>
    }
    @if (pendingNetworkChanges) {
      <button hlmBtn variant="ghost" size="icon-lg" type="button" id="network" [hlmTooltip]="mat_tooltips.pending_network_changes | translate" [attr.aria-label]="mat_tooltips.pending_network_changes | translate" (click)="showNetworkChangesPending()" class="topbar-button-right"
        ix-auto ix-auto-type="button" ix-auto-identifier="networkPending">
        <mat-icon class="movement">device_hub</mat-icon>
      </button>
    }
    @if (showResilvering) {
      <button hlmBtn variant="ghost" size="icon-lg" type="button" id="resilver" [hlmTooltip]="mat_tooltips.resilvering | translate" [attr.aria-label]="mat_tooltips.resilvering | translate" (click)="showResilveringDetails()" class="topbar-button-right"
        ix-auto ix-auto-type="button" ix-auto-identifier="resilvering">
        <mat-icon class="fa-spin">autorenew</mat-icon>
      </button>
    }
    <!-- Directory Services Monitor -->
    @if (showDirServicesIcon) {
      <button hlmBtn variant="ghost" size="icon-lg" type="button" id="dirservices-manager" [hlmTooltip]="mat_tooltips.directory_services_monitor | translate" [attr.aria-label]="mat_tooltips.directory_services_monitor | translate" (click)="onShowDirServicesMonitor()"
        ix-auto ix-auto-type="button" ix-auto-identifier="dirServices">
        <mat-icon>info</mat-icon>
      </button>
    }
    <!-- Task Manager -->
    <button hlmBtn variant="ghost" size="icon-lg" type="button" id="task-manager" [hlmTooltip]="mat_tooltips.task_manager | translate" [attr.aria-label]="mat_tooltips.task_manager | translate" (click)="onShowTaskManager()"
      ix-auto ix-auto-type="button" ix-auto-identifier="taskManager">
      <mat-icon>assignment</mat-icon>
    </button>
    <!-- Notification toggle button -->
    <button hlmBtn variant="ghost" size="icon-lg" type="button" [hlmTooltip]="mat_tooltips.alerts | translate" [attr.aria-label]="mat_tooltips.alerts | translate" (click)="toggleNotific()" [style.overflow]="'visible'" class="topbar-button-right"
      ix-auto ix-auto-type="button" ix-auto-identifier="notifications">
      <mat-icon>notifications</mat-icon>
      @if (notifications.length > 0) {
        <span class="notification-number mat-bg-warn">{{notifications.length}}</span>
      }
    </button>
    <!-- User and UI menu -->
    <!-- the internal development record: the account and power menus on the helm dropdown-menu (M1), aligned to
         the trigger's end; the triggers stay the shell's icon buttons. -->
    <button name="Settings" hlmBtn variant="ghost" size="icon-lg" type="button" [hlmTooltip]="mat_tooltips.settings | translate" [attr.aria-label]="mat_tooltips.settings | translate" [hlmDropdownMenuTrigger]="accountMenu" align="end" class="topbar-button-right"
      ix-auto ix-auto-type="button" ix-auto-identifier="settings">
      <mat-icon>settings</mat-icon>
    </button>
    <ng-template #accountMenu>
      <hlm-dropdown-menu class="topbar-menu">
        <button name="settings-change-password" hlmDropdownMenuItem type="button" [routerLink]="['/account/users/change-password']"
          ix-auto ix-auto-type="option" ix-auto-identifier="Change Password">
          <mat-icon aria-hidden="true">dialpad</mat-icon>
          <span>{{'Change Password' | translate}}</span>
        </button>
        <button name="settings-preferences" hlmDropdownMenuItem type="button" [routerLink]="['/ui-preferences']"
          ix-auto ix-auto-type="option" ix-auto-identifier="Preferences">
          <mat-icon aria-hidden="true">settings_applications</mat-icon>
          <span>{{'Preferences' | translate}}</span>
        </button>
        <button name="settings-api" hlmDropdownMenuItem type="button" [routerLink]="['/apikeys']"
          ix-auto ix-auto-type="option" ix-auto-identifier="API">
          <mat-icon aria-hidden="true">laptop</mat-icon>
          <span>{{'API Keys' | translate}}</span>
        </button>
        <button name="settings-about" hlmDropdownMenuItem type="button" (triggered)="onShowAbout()"
          ix-auto ix-auto-type="option" ix-auto-identifier="About">
          <mat-icon aria-hidden="true">info</mat-icon>
          <span>{{'About' | translate}}</span>
        </button>
      </hlm-dropdown-menu>
    </ng-template>
    <!-- Top right power menu -->
    <button name="Power" hlmBtn variant="ghost" size="icon-lg" type="button" [hlmTooltip]="mat_tooltips.power | translate" [attr.aria-label]="mat_tooltips.power | translate" [hlmDropdownMenuTrigger]="runMenu" align="end" class="topbar-button-right"
      ix-auto ix-auto-type="button" ix-auto-identifier="power">
      <mat-icon>power_settings_new</mat-icon>
    </button>
    <ng-template #runMenu>
      <hlm-dropdown-menu class="topbar-menu">
        <button name="power-log-out" hlmDropdownMenuItem type="button" (triggered)="signOut()"
          ix-auto ix-auto-type="option" ix-auto-identifier="Log Out">
          <mat-icon aria-hidden="true">exit_to_app</mat-icon>
          <span>{{'Log Out' | translate}}</span>
        </button>
        <button name="power-restart" hlmDropdownMenuItem type="button" (triggered)="onReboot()"
          ix-auto ix-auto-type="option" ix-auto-identifier="Restart">
          <mat-icon aria-hidden="true">replay</mat-icon>
          <span>{{'Restart' | translate}}</span>
        </button>
        <button name="power-shut-down" hlmDropdownMenuItem type="button" (triggered)="onShutdown()"
          ix-auto ix-auto-type="option" ix-auto-identifier="Shut Down">
          <mat-icon aria-hidden="true">power_settings_new</mat-icon>
          <span>{{'Shut Down' | translate}}</span>
        </button>
      </hlm-dropdown-menu>
    </ng-template>
  </div>
</div>
