<section class="fc-page fc-tabbed" aria-labelledby="rsync-title"><!-- the internal development record: the iSCSI host shape -- no card around the tab bar -->
  <h1 id="rsync-title" class="fc-page-title">{{ 'Rsync' | translate }}</h1><!-- the internal development record: one page title over both tabs -->
  <nav fcTabNav stretch><!-- the internal development record: the shell's tab bar, the halves stretched as mat-tab-nav-bar drew them -->
    @for (link of navLinks; track link) {
      <a fcTabLink [routerLink]="link.path" routerLinkActive #rla="routerLinkActive" [active]="rla.isActive"
        ix-auto ix-auto-type="tab" ix-auto-identifier="{{link.label}}">
        {{link.label}}
      </a>
    }
  </nav>
  <router-outlet>
    @if (activedTab == 'configure') {
      <app-configure-rsync></app-configure-rsync>
    }
    @if (activedTab == 'rsync-module') {
      <app-rsync-module-list></app-rsync-module-list>
    }
  </router-outlet>
</section>
