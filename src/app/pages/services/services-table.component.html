@if (!conf.showSpinner) {
  <ngx-datatable
    #datatable class='material'
    [style.height.px]="tableHeight"
    [rows]='data'
    [columnMode]="'force'"
    [rowHeight]="rowHeight"
    [headerHeight]="headerHeight"
    [footerHeight]="footerHeight"
    [scrollbarH]="true"
    [scrollbarV]="true">
    <ngx-datatable-column name="Label" [minWidth]="150">
      <ng-template let-column="column" ngx-datatable-header-template>
        <span class="datatable-header-cell-label">{{'Name' | translate}}</span>
      </ng-template>
      <ng-template let-value="value" ngx-datatable-cell-template>
        <div id="row-name__{{value}}"
        ix-auto ix-auto-type="value" ix-auto-identifier="{{value}}">{{value}}</div>
      </ng-template>
    </ngx-datatable-column>
    <ngx-datatable-column name="State" [minWidth]="100">
      <ng-template let-column="column" ngx-datatable-header-template>
        <span class="datatable-header-cell-label">{{'Running' | translate}}</span>
      </ng-template>
      <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
        @if (row['onChanging']) {
          <hlm-spinner class="service-spinner" />
        } @else {
          <!-- the internal development record: the overlay covers exactly the switch it stands in for;
               the internal development record: the switch is the S1 hlm-switch, display-only behind it. -->
          <span class="service-toggle" ix-auto ix-auto-type="slider" ix-auto-identifier="{{row.label}}_Running">
            <div class="clickable" role="switch" tabindex="0"
              id="overlay__{{row.label}}_Running"
              ix-auto ix-auto-type="overlay" ix-auto-identifier="{{row.label}}_Running"
              [attr.aria-checked]="value === 'RUNNING'"
              [attr.aria-label]="row.label + ' ' + ('Running' | translate)"
              (click)="this.conf.toggle(row)"
              (keydown.enter)="this.conf.toggle(row)"
              (keydown.space)="$event.preventDefault(); this.conf.toggle(row)"
              hlmTooltip="{{value}}" position="right">
            </div>
            <hlm-switch
              [checked]="value === 'RUNNING'"
              id="slide-toggle__{{row.label}}_Running"
              [inputId]="'slide-toggle__' + row.label + '_Running-button'"
              [tabIndex]="-1"
              aria-hidden="true"
            />
          </span>
        }
      </ng-template>
    </ngx-datatable-column>
    <ngx-datatable-column name="Enable" [minWidth]="180">
      <ng-template let-column="column" ngx-datatable-header-template>
        <span class="datatable-header-cell-label">{{'Start Automatically' | translate}}</span>
      </ng-template>
      <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
        <!-- the internal development record: the #352 box in its 32px cell (the cell takes the click too). -->
        <span class="checkbox-cell" (click)="$event.target === $event.currentTarget && onAutostartCell(row)"
          ix-auto ix-auto-type="checkbox" ix-auto-identifier="{{row.label}}_Start Automatically">
          <hlm-checkbox id="checkbox__{{row.label}}" class="checkbox" [checked]="row.enable" (checkedChange)="onAutostart($event, row)"
            [inputId]="'checkbox__' + row.label + '-input'"
            [aria-label]="row.label + ' ' + ('Start Automatically' | translate)" />
        </span>
      </ng-template>
    </ngx-datatable-column>
    <ngx-datatable-column name="Actions" [flexGrow]="2" [minWidth]="120">
      <ng-template let-column="column" ngx-datatable-header-template>
        <span class="datatable-header-cell-label">{{'Actions' | translate}}</span>
      </ng-template>
      <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
        <button hlmBtn variant="ghost" size="icon" type="button" class="service-action" id="action-button__{{row.label}}" (click)="this.conf.editService(row.title)" hlmTooltip="Configure" position="right"
          ix-auto ix-auto-type="button" ix-auto-identifier="{{row.label}}_Actions" [attr.aria-label]="'Configure' | translate">
          <mat-icon>edit</mat-icon>
        </button>
        @if (row.title == 'netdata' && row.state == 'RUNNING') {
          <button hlmBtn variant="ghost" size="icon" type="button" class="service-action" (click)="this.conf.openNetdataPortal()" hlmTooltip="Launch" position="right" [attr.aria-label]="'Launch' | translate">
            <mat-icon>featured_play_list</mat-icon>
          </button>
        }
      </ng-template>
    </ngx-datatable-column>
  </ngx-datatable>
}
