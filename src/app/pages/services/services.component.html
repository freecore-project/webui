<h2 class="fc-services-title fc-page-title">{{ 'Services' | translate }}</h2>
<!-- the internal development record: the list host on the page shell. The header row is the list toolbar's #351
     filter group (the search glyph as its addon, the #filter ref on the native input) beside the
     loading glyph; the table follows. Never id="filter" here: material-reduction.css hacks that id. -->
<div class="fc-page">
  <div class="services-header-layout">
    <div id="services-filter" class="fc-table-search services-filter">
      <hlm-input-group>
        <hlm-input-group-addon (click)="filter.focus()"><mat-icon aria-hidden="true">search</mat-icon></hlm-input-group-addon>
        <input hlmInputGroupInput #filter type="text" placeholder="{{'Filter' | translate}} {{'Services' | translate}}"
          [attr.aria-label]="('Filter' | translate) + ' ' + ('Services' | translate)"
          [ngModel]="searchTerm"
          (ngModelChange)="displayFilter('label',$event)">
      </hlm-input-group>
    </div>
    @if (showSpinner) {
      <hlm-spinner id="services-spinner" />
    }
  </div>
  <div class="services-table-row-layout">
    <services-table class="services-table-layout" [conf]="this" [data]="cards"></services-table>
  </div>
</div>
