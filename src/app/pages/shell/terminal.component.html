<div class="terminal-wrapper">
  <div class="terminal-surface" #terminalContainer (contextmenu)="onRightClick()"></div>

  @if (status.state !== 'connected') {
    <div class="terminal-overlay">
      <div class="terminal-overlay-box">
        @if (status.state === 'connecting') {
          <hlm-spinner />
          <span>{{ 'Connecting…' | translate }}</span>
        }
        @if (status.state !== 'connecting') {
          <span class="terminal-overlay-reason">
            {{ (status.state === 'closed' ? 'The session has ended.' : status.reason) | translate }}
          </span>
          <button hlmBtn variant="outline" type="button" (click)="reconnect()"
            ix-auto ix-auto-type="button" ix-auto-identifier="RECONNECT">
            {{ 'Reconnect' | translate }}
          </button>
        }
      </div>
    </div>
  }
</div>

<!-- the internal development record: a viewer has no keyboard, so it gets no font row and no
     Ctrl+C tooltip -- System Processes passes readonly. -->
@if (!readonly) {
  <div class="terminal-toolbar">
    <span class="terminal-toolbar-label">{{ 'Font size' | translate }}</span>
    <!-- the internal development record: the kit slider, named by the visible label -->
    <hlm-slider class="terminal-font-slider" min="10" max="20" step="1" [value]="fontSizeValue"
      (valueChange)="onFontSizeChange($event[0])" [aria-label]="'Font size' | translate"
      ix-auto ix-auto-type="slider" ix-auto-identifier="Set font size" />
    <button hlmBtn variant="ghost" size="sm" type="button" (click)="resetFontSize()"
      hlmTooltip="{{ 'Reset font size to default value' | translate }}"
      ix-auto ix-auto-type="button" ix-auto-identifier="RESTORE DEFAULT">
      {{ 'Restore default' | translate }}
    </button>

    <span class="terminal-toolbar-spacer"></span>

    <tooltip [message]="tooltip"
    ix-auto ix-auto-type="tooltip-icon" ix-auto-identifier="terminal-tooltip"></tooltip>
  </div>
}
