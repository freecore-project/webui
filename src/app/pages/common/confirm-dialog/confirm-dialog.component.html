<h2 mat-dialog-title>{{ title | translate }}</h2>
<div mat-dialog-content id="confirm-msg">
  @if (secondaryCheckBox) {
    <div class="checkbox-row">
      <span class="checkbox-cell">
        <hlm-checkbox inputId="confirm-dialog__secondary-checkbox" (checkedChange)="secondaryCheckBoxEvent($event)"
          ix-auto
          ix-auto-type="checkbox"
          ix-auto-identifier="{{secondaryCheckBoxMsg | uppercase}}" />
      </span>
      <label hlmLabel id="confirm-label" class="checkbox-label" for="confirm-dialog__secondary-checkbox">{{ secondaryCheckBoxMsg | translate }}</label>
      @if (tooltip) {
        <tooltip [message]="tooltip"></tooltip>
      }
    </div>
  }
  <div class="message-content">
    <span [innerHTML]="message | translate"></span>
  </div>
</div>

<div mat-dialog-actions>
  @if (!hideCheckBox) {
    <div class="checkbox-row">
      <span class="checkbox-cell">
        <hlm-checkbox inputId="confirm-dialog__confirm-checkbox" name="confirm_checkbox" (checkedChange)="toggleSubmit($event)"
          ix-auto
          ix-auto-type="checkbox"
          ix-auto-identifier="CONFIRM" />
      </span>
      <label hlmLabel class="checkbox-label" for="confirm-dialog__confirm-checkbox">{{ "Confirm" | translate }}</label>
    </div>
  }
  <span class="dialog-action-spacer"></span>
  @if (!hideCancel) {
    <button hlmBtn variant="outline" type="button" id="confirm-dialog__cancel-button" name="cancel_button" (click)="dialogRef.close(false)"
      ix-auto
      ix-auto-type="button"
      ix-auto-identifier="{{cancelMsg | uppercase}}">{{ cancelMsg | translate }}</button>
  }
  <button hlmBtn type="button" id="confirm-dialog__action-button" name="ok_button" [disabled]="isDisabled()" (click)="customSumbit ? customSumbit() : dialogRef.close(true)"
    ix-auto
    ix-auto-type="button"
    ix-auto-identifier="{{buttonMsg | uppercase}}">{{ buttonMsg | translate }}</button>
</div>
