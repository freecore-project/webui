<h2 mat-dialog-title id="err-title">
  <mat-icon class="warning-icon" aria-hidden="true">report_problem</mat-icon>
  {{ title | translate }}
</h2>
<div mat-dialog-content id="err-md-content">
  <div id="err-message-wrapper"><span [innerHTML]="message"></span></div>
  @if (backtrace) {
    <details class="fc-dialog-details" id="err-bt-panel" [open]="!isCloseMoreInfo" (toggle)="toggleOpen($event)"
      ix-auto
      ix-auto-type="button"
      ix-auto-identifier="backtrace-toggle">
      <summary>{{ 'More info...' | translate }}</summary>
      <pre id="err-bt-text" class="fc-dialog-pre">{{ 'Error' | translate }}: {{backtrace}}</pre>
    </details>
  }
</div>
<div mat-dialog-actions>
  <span class="dialog-action-spacer"></span>
  <button hlmBtn variant="outline" type="button" (click)="dialogRef.close(true)"
    ix-auto
    ix-auto-type="button"
    ix-auto-identifier="CLOSE">{{ "Close" | translate }}</button>
  @if (logs) {
    <button hlmBtn type="button" (click)="downloadLogs()"
      ix-auto
      ix-auto-type="button"
      ix-auto-identifier="DOWNLOAD LOGS">{{ "Download Logs" | translate }}</button>
  }
</div>
