@if (!config['isHidden']) {
  <!-- the internal development record: Material-free. The control is registered through a hidden native input
       (the same DefaultValueAccessor the hidden matInput used; the FormControl itself comes from
       createFormGroup either way); errors use the #392 line. -->
  <div id="{{config.name}}" class="dynamic-field form-paragraph" [formGroup]="group" [ngClass]="fieldShow" [class.has-tooltip]="config.tooltip">
    <div class="paragraph-layout-row">
      @if (config.paragraphIcon) {
        <mat-icon class="paragraph-icon" [style.width]="config.paragraphIconSize" [style.height]="config.paragraphIconSize" [style.fontSize]="config.paragraphIconSize">{{ config.paragraphIcon }}</mat-icon>
      }
      <p [class.large]="config.isLargeText" [innerHTML]="config.paraText | translate | docreplace"></p>
      @if (config.tooltip) {
        <tooltip class="paratext-tooltip" [header]="config.placeholder" [message]="config.tooltip" [position]="config.tooltipPosition ? config.tooltipPosition : null"></tooltip>
      }
    </div>
    @if (config['hasErrors']) {
      <p class="form-error-line" role="alert">{{config['errors']}}</p>
    }
    <input type="hidden" id="{{config.name}}-input" [formControlName]="config.name">
  </div>
}
