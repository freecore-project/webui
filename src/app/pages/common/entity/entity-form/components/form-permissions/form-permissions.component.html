@if (!config['isHidden']) {
  <!-- the internal development record: the mode matrix on spartan -- nine hlm checkboxes in the #394 32px cells,
       the label row on the field vocabulary, the octal value written by the same toggle logic. The
       control stays registered through a hidden native input, as before. -->
  <div id="{{config.name}}" class="dynamic-field form-permissions" [formGroup]="group" [ngClass]="fieldShow" [class.has-tooltip]="config.tooltip"
    ix-auto ix-auto-type="permissions" ix-auto-identifier="{{config.placeholder}}">
    <div class="form-permissions-head">
      <label hlmFieldLabel>{{ config.placeholder | translate }}</label>
      @if (config.tooltip) {
        <tooltip [header]="config.placeholder" [message]="config.tooltip" [position]="config.tooltipPosition ? config.tooltipPosition : null"></tooltip>
      }
      <input type="hidden" [formControlName]="config.name"
        ix-auto ix-auto-type="input" ix-auto-identifier="{{config.placeholder}}">
    </div>
    <table class="form-permissions-matrix">
      <tr class="form-permissions-what">
        <td></td>
        <td>{{"Read" | translate}}</td>
        <td>{{"Write" | translate}}</td>
        <td>{{"Execute" | translate}}</td>
      </tr>
      <tr>
        <td class="form-permissions-who">{{"User" | translate}}</td>
        <td>
          <span class="checkbox-cell" (click)="$event.target === $event.currentTarget && toggleOwnerRead()">
            <hlm-checkbox [checked]="ownerRead" (checkedChange)="toggleOwnerRead()"
              ix-auto
              ix-auto-type="checkbox"
              ix-auto-identifier="{{config.name}}_ownerRead" />
          </span>
        </td>
        <td>
          <span class="checkbox-cell" (click)="$event.target === $event.currentTarget && toggleOwnerWrite()">
            <hlm-checkbox [checked]="ownerWrite" (checkedChange)="toggleOwnerWrite()"
              ix-auto
              ix-auto-type="checkbox"
              ix-auto-identifier="{{config.name}}_ownerWrite" />
          </span>
        </td>
        <td>
          <span class="checkbox-cell" (click)="$event.target === $event.currentTarget && toggleOwnerExec()">
            <hlm-checkbox [checked]="ownerExec" (checkedChange)="toggleOwnerExec()"
              ix-auto
              ix-auto-type="checkbox"
              ix-auto-identifier="{{config.name}}_ownerExec" />
          </span>
        </td>
      </tr>
      <tr>
        <td class="form-permissions-who">{{"Group" | translate}}</td>
        <td>
          <span class="checkbox-cell" (click)="$event.target === $event.currentTarget && toggleGroupRead()">
            <hlm-checkbox [checked]="groupRead" (checkedChange)="toggleGroupRead()"
              ix-auto
              ix-auto-type="checkbox"
              ix-auto-identifier="{{config.name}}_groupRead" />
          </span>
        </td>
        <td>
          <span class="checkbox-cell" (click)="$event.target === $event.currentTarget && toggleGroupWrite()">
            <hlm-checkbox [checked]="groupWrite" (checkedChange)="toggleGroupWrite()"
              ix-auto
              ix-auto-type="checkbox"
              ix-auto-identifier="{{config.name}}_groupWrite" />
          </span>
        </td>
        <td>
          <span class="checkbox-cell" (click)="$event.target === $event.currentTarget && toggleGroupExec()">
            <hlm-checkbox [checked]="groupExec" (checkedChange)="toggleGroupExec()"
              ix-auto
              ix-auto-type="checkbox"
              ix-auto-identifier="{{config.name}}_groupExec" />
          </span>
        </td>
      </tr>
      @if (!config.noexec) {
      <tr>
        <td class="form-permissions-who">{{"Other" | translate}}</td>
        <td>
          <span class="checkbox-cell" (click)="$event.target === $event.currentTarget && toggleOtherRead()">
            <hlm-checkbox [checked]="otherRead" (checkedChange)="toggleOtherRead()"
              ix-auto
              ix-auto-type="checkbox"
              ix-auto-identifier="{{config.name}}_otherRead" />
          </span>
        </td>
        <td>
          <span class="checkbox-cell" (click)="$event.target === $event.currentTarget && toggleOtherWrite()">
            <hlm-checkbox [checked]="otherWrite" (checkedChange)="toggleOtherWrite()"
              ix-auto
              ix-auto-type="checkbox"
              ix-auto-identifier="{{config.name}}_otherWrite" />
          </span>
        </td>
        <td>
          <span class="checkbox-cell" (click)="$event.target === $event.currentTarget && toggleOtherExec()">
            <hlm-checkbox [checked]="otherExec" (checkedChange)="toggleOtherExec()"
              ix-auto
              ix-auto-type="checkbox"
              ix-auto-identifier="{{config.name}}_otherExec" />
          </span>
        </td>
      </tr>
      }
    </table>
    @if (config['hasErrors']) {
      <p class="form-error-line" role="alert">{{config['errors']}}</p>
    }
  </div>
}
