@if (!config['isHidden']) {
  <!-- the internal development record: the upload field on the #351 stack -- label row, the native file input
       (spartan has no file input; the formControlName is what lets a required validator gate
       Save), the optional Upload action beside it, errors and warnings in the reserved subscript,
       the help glyph anchored top-right like every other field. -->
  <div id="{{config.name}}" class="dynamic-field form-input form-upload" [formGroup]="group" [ngClass]="fieldShow" [class.has-tooltip]="config.tooltip"
    ix-auto ix-auto-type="file-uploader" ix-auto-identifier="{{config.placeholder}}">
    <hlm-field class="full-width" [forceInvalid]="!!config['hasErrors']">
      @if (config | fieldLabel) {
        <label hlmFieldLabel [for]="inputId">{{ config | fieldLabel | translate }}</label>
      }
      <div class="form-upload-row">
        <input type="file" #fileInput [id]="inputId" accept="{{config.acceptedFiles}}" [attr.multiple]="config.multiple ? '' : null"
          [formControlName]="config.name" (change)="config.hideButton ? upload(config.fileLocation) : null">
        @if (!config.hideButton) {
          <div class="form-upload-actions">
            <button hlmBtn variant="outline" type="button" (click)="upload(config.fileLocation)"
              ix-auto ix-auto-type="button" ix-auto-identifier="UPLOAD">{{ 'Upload' | translate }}</button>
          </div>
        }
      </div>
      <div class="field-subscript">
        @if (config['hasErrors']) {
          <p class="form-error-line" role="alert" [innerHTML]="config['errors'] | translate"></p>
        }
        @if (config.warnings) {
          <p class="form-error-line" role="alert" [innerHTML]="config.warnings | translate"></p>
        }
      </div>
    </hlm-field>
    @if (config.tooltip) {
      <tooltip [header]="config.placeholder" [message]="config.tooltip" [position]="config.tooltipPosition ? config.tooltipPosition : null"></tooltip>
    }
  </div>
}
