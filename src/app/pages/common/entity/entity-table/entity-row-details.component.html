<!-- the internal development record: the same band as the table's own (entity-table-row-details) for the pages
     that bring their own details: actions first as text, then the facts as a grid. -->
@if (conf.actions && conf.actions.length > 0) {
  <section class="entity-row-details-layout entity-row-details-actions-layout">
    @for (action of conf.actions; track action) {
      @if (isActionVisible(action)) {
        <button
          class="entity-row-details-action-layout"
          [class.button-delete]="action.id === 'delete'"
          hlmBtn variant="ghost"
          type="button"
          (click)="action.onClick(conf.config)"
          id="{{ conf.entityName }}_{{ action.name }}_{{ action.id }}"
          >
          <span>{{ action.label | translate }}</span>
        </button>
      }
    }
  </section>
}

<section class="entity-row-details-layout entity-row-details-summary-layout">
  @for (detail of conf.details; track detail) {
    <div>
      <p>{{ detail.label | uppercase | translate }}</p>
      <h4 class="mb-0">{{ detail.value }}</h4>
    </div>
  }
</section>
