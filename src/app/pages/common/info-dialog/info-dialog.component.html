<h2 mat-dialog-title>
  <mat-icon aria-hidden="true">{{icon}}</mat-icon>
  {{ title | translate }}
</h2>
<div mat-dialog-content>
  @if (!is_html && isMultiline) {
    <pre class="fc-dialog-pre">{{ info | translate }}</pre>
  } @else if (!is_html) {
    <div>{{ info | translate }}</div>
  } @else {
    <div [innerHTML]="info"></div>
  }
</div>
<div mat-dialog-actions>
  <span class="dialog-action-spacer"></span>
  <button hlmBtn variant="outline" type="button" (click)="dialogRef.close(true)"
    ix-auto
    ix-auto-type="button"
    ix-auto-identifier="CLOSE">{{ "Close" | translate }}</button>
</div>
