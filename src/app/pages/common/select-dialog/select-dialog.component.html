<h2 mat-dialog-title>{{ title | translate }}</h2>
<div mat-dialog-content>
  <!-- the internal development record: the #393 field -- label row, the select trigger as the box, the panel in
       the overlay's top layer above the dialog. -->
  <hlm-field class="full-width">
    <label hlmFieldLabel for="select-dialog__value">{{ optionPlaceHolder | translate }}</label>
    <hlm-select [ngModel]="DisplaySelection" (ngModelChange)="DisplaySelection = $event; switchSelection()" [itemToString]="labelOf"
      ix-auto ix-auto-type="select" ix-auto-identifier="{{optionPlaceHolder}}">
      <hlm-select-trigger buttonId="select-dialog__value">
        <hlm-select-value [placeholder]="optionPlaceHolder | translate" />
      </hlm-select-trigger>
      <hlm-select-content *hlmSelectPortal>
        @for (option of options; track option.value) {
          <hlm-select-item [value]="option.value"
            ix-auto ix-auto-type="option" ix-auto-identifier="{{option.label}}">
            {{ option.label | translate }}
          </hlm-select-item>
        }
      </hlm-select-content>
    </hlm-select>
    <div class="field-subscript"></div>
  </hlm-field>
</div>
<div mat-dialog-actions>
  <span class="dialog-action-spacer"></span>
  <button hlmBtn variant="outline" type="button" (click)="dialogRef.close(false)"
    ix-auto
    ix-auto-type="button"
    ix-auto-identifier="CLOSE">{{"Close" | translate }}</button>
  <button hlmBtn type="button" [disabled]="DisplaySelection == null" (click)="dialogRef.close(true)"
    ix-auto
    ix-auto-type="button"
    ix-auto-identifier="OK">{{"OK" | translate }}</button>
</div>
