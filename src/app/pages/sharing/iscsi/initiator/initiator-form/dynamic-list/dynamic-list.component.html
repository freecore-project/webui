<!-- the internal development record: the three icon actions are hlmBtn ghost icons (the glyph sized by the page's
     [data-slot="button"] .mat-icon rule); class move-to-btn, the aria-labels, ix-auto and [disabled] are
     the hooks the page and its specs key on. the internal development record: the list is a plain ul (no mat-list). -->
<div class="dynamic-list-container dynamic-list-row-layout" [ngClass]="this.listControl.disabled ? 'disabled' : ''">
  <div class="move-to-action dynamic-list-move-action-layout">
    <button ix-auto ix-auto-type="button" [ix-auto-identifier]="listControl"
      [attr.aria-label]="('Add selected items to' | translate) + ' ' + (config.placeholder | translate)"
      hlmBtn variant="ghost" size="icon" class="move-to-btn" type="button" (click)="drop()"
      [disabled]="this.listControl.disabled">
      <mat-icon>arrow_forward</mat-icon>
    </button>
  </div>
  <div class="dynamic-list-flex-content-layout">
    <div class="input-add dynamic-list-row-layout">
      <div class="dynamic-list-flex-content-layout">
        <div id="dynamicField_auth_network_add" dynamicField [config]="inputConfig" [group]="formGroup"
        [fieldShow]="'show'"></div>
      </div>
      <div>
        <button ix-auto ix-auto-type="button" ix-auto-identifier="{{inputConfig.name}}_add"
          [attr.aria-label]="('Add' | translate) + ' ' + (config.placeholder | translate)"
          hlmBtn variant="ghost" size="icon" type="button" (click)="add()"
          [disabled]="this.listControl.disabled || !this.inputControl.valid">
          <mat-icon>add</mat-icon>
        </button>
      </div>
    </div>
    <div class="dynamic-list-row-layout">
      <div class="dynamic-list">
        <ul class="dynamic-list-items">
          @for (item of this.listControl.value; track item) {
            <li class="dynamic-list">
              <label class="dynamic-list-item">{{item}}</label>
              <button ix-auto ix-auto-type="button" ix-auto-identifier="{{inputConfig.name}}_remove"
                [attr.aria-label]="('Remove' | translate) + ' ' + item"
                hlmBtn variant="ghost" size="icon" type="button" class="dynamic-list-remove" (click)="remove(item)"
                [disabled]="this.listControl.disabled">
                <mat-icon>remove</mat-icon>
              </button>
            </li>
          }
        </ul>
      </div>
    </div>
  </div>
</div>
