<!-- the internal development record: the initiator form on the settings-form law (entity-form.component.html) --
     a .fc-page--capped page, the form as the .fc-settings-form container, one 'General' section on
     the engine's grid (entity-form.component.scss, emulated through styleUrls) and the shared row /
     voice rules in freecore-ui.css. The card, the page-private 2-column .form-wrap and the bootstrap
     btn classes went; every id, ix-auto hook, the #connectedInitiatorsList ref and the .disabled
     class on the container stay (tests/bdd/core/test_NAS_T1020.py enters this form). -->
<div class="fc-page fc-page--capped fc-initiator-form">
  <h1 class="fc-initiator-title fc-page-title">{{ 'Initiator Group' | translate }}</h1>
  <form class="fc-settings-form" (ngSubmit)="onSubmit($event)" [formGroup]="formGroup">
    <div class="fieldset-container fieldset-display-default">
      <section class="fc-settings-section" aria-labelledby="initiator-section-general">
        <h2 class="fieldset-label" id="initiator-section-general">{{ 'General' | translate }}</h2>
        <div class="fc-settings-fields">
          <div class="entity-form-field-layout form-line fc-settings-wide" [hidden]="fieldConfig[0].isHidden" id="general-0">
            <div id="dynamicField_allow_all_initiators" dynamicField [config]="fieldConfig[0]" [group]="formGroup"
            [fieldShow]="'show'"></div>
          </div>
          <div class="connected-initiators-container entity-form-field-layout has-tooltip"
            [class.disabled]="connectedInitiatorsDisabled" id="general-1">
            <label>{{'Connected Initiators' | translate}}</label>
            <tooltip [message]="connectedInitiatorsTooltip"></tooltip>
            <!-- the internal development record: the pick list on kit checkboxes (the #394 row) -- a labelled group of
                 checkboxes; the two lists below read the picks through connectedSelection, which keeps the
                 selectedOptions / deselectAll shape the mat-selection-list gave them. -->
            <div class="connected-initiators-list" role="group" [attr.aria-label]="'Connected Initiators' | translate">
              @for (initiator of connectedInitiators; track initiator; let i = $index) {
                <div class="checkbox-row connected-initiator">
                  <span class="checkbox-cell">
                    <hlm-checkbox [inputId]="'connected-initiator-' + i" [disabled]="connectedInitiatorsDisabled"
                      [checked]="connectedSelection.isSelected(initiator)" (checkedChange)="connectedSelection.toggle(initiator, $event)" />
                  </span>
                  <label hlmLabel class="checkbox-label" [for]="'connected-initiator-' + i">{{initiator['initiator']}} ({{initiator['initiator_addr']}})</label>
                </div>
              }
            </div>
            <div class="initiator-refresh-layout">
              <button hlmBtn variant="ghost" type="button" (click)="getConnectedInitiators()"
                ix-auto ix-auto-type="button" ix-auto-identifier="refresh"
                [disabled]="connectedInitiatorsDisabled">
                <mat-icon>refresh</mat-icon> {{'Refresh' | translate}}
              </button>
            </div>
          </div>
          <div class="entity-form-field-layout" id="general-2">
            <app-dynamic-list [config]="fieldConfig[1]" [group]="formGroup" [source]="connectedSelection">
            </app-dynamic-list>
            <app-dynamic-list [config]="fieldConfig[2]" [group]="formGroup" [source]="connectedSelection">
            </app-dynamic-list>
          </div>
          <div class="entity-form-field-layout form-line fc-settings-wide" [hidden]="fieldConfig[3].isHidden" id="general-3">
            <div id="dynamicField_comment" dynamicField [config]="fieldConfig[3]" [group]="formGroup"
            [fieldShow]="'show'"></div>
          </div>
        </div>
      </section>
      <div class="buttons">
        <button hlmBtn id="save_button" type="submit"
          ix-auto ix-auto-type="button" ix-auto-identifier="save"
        [disabled]="!formGroup.valid">{{ "Save" | translate }}</button>
        @if (route_success) {
          <button hlmBtn variant="outline" id="goback_button" type="button" (click)="goBack()"
            ix-auto ix-auto-type="button" ix-auto-identifier="cancel"
          >{{ "Cancel" | translate }}</button>
        }
      </div>
    </div>
    @if (error) {
      <div id="error_message" class="form-error-line" role="alert"><div [innerHTML]="error"></div></div>
    }
  </form>
</div>
