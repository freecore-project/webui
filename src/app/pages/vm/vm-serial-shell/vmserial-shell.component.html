<section id="vm-serial-page" class="fc-page fc-console" aria-labelledby="vm-serial-title">
  <h1 id="vm-serial-title" class="fc-page-title">{{ 'Shell' | translate }}: {{ name || pk }}</h1>

  @if (pk !== undefined) {
    <div class="fc-console-surface">
      <ix-terminal [target]="{ vm_id: pk }" [tooltip]="tooltip"></ix-terminal>
    </div>
  }
</section>
