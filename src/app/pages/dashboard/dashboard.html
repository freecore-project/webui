<div class="widgets-wrapper-container" (window:resize)="onMobileResize($event)">

  <div class="widgets-wrapper">

    <!-- SORTABLE WIDGETS -->
    <ng-container  *ngIf="screenType == 'Desktop' && statsDataEvents && pools && nics && volumeData && sysinfoReady">
      <ng-container  *ngIf="dashState">
        <ng-container  *ngFor="let widget of dashState">
          <ng-container  *ngIf="widget.rendered">
            <ng-container [ngSwitch]="widget.name.toLowerCase()">

              <widget-sysinfo *ngSwitchCase="'system information'"
                id="active"
                [isHA]="isHA"
                [passive]="false"
                [widgetSize]="medium">
              </widget-sysinfo>

              <widget-sysinfo *ngSwitchCase="'system information(standby)'"
                id="passive"
                [isHA]="isHA"
                [passive]="true"
                [widgetSize]="medium">
              </widget-sysinfo>

              <widget-help
                *ngSwitchCase="'help'"
                [widgetSize]="medium"
              ></widget-help>

              <widget-cpu *ngSwitchCase="'cpu'"
                [data]="dataFromConfig(widget)"
                [cpuModel]="systemInformation.model"
                [widgetSize]="medium"
                configurable="false">
              </widget-cpu>

              <widget-memory *ngSwitchCase="'memory'"
                [ecc]="systemInformation.ecc_memory"
                [data]="dataFromConfig(widget)"
                [widgetSize]="medium"
                configurable="false">
              </widget-memory>

              <widget-pool *ngSwitchCase="'pool'"
                [poolState]="dataFromConfig(widget)"
                [volumeData]="volumeDataFromConfig(widget)"
                [widgetSize]="medium"
                configurable="false">
              </widget-pool>

              <widget-nic *ngSwitchCase="'interface'"
                [nicState]="dataFromConfig(widget)"
                [stats]="statsDataEvents"
                [widgetSize]="medium"
                configurable="false">
              </widget-nic>

              <widget-network *ngSwitchCase="'network'"
                [nics]="dataFromConfig(widget)"
                [stats]="statsDataEvents"
                [widgetSize]="medium"
                configurable="false">
              </widget-network>

            </ng-container>
          </ng-container>
        </ng-container>
      </ng-container>
    </ng-container>

  </div>
</div>

    <!-- MOBILE WIDGETS -->
    <div class="mobile-viewport" [ngClass]="{'hidden': screenType == 'Desktop'}">
      <div class="carousel">
        <widget-controller (launcher)="onMobileLaunch($event)"
          *ngIf="screenType == 'Mobile' && dashState && dashState.length > 0;"
          [rendered]="true"
          [dashState]="dashState"
          [widgetSize]="medium"
          configurable="false">
        </widget-controller>

        <div class="mobile-widget-container">
          <ng-container  *ngIf="screenType == 'Mobile' && statsDataEvents && pools && nics && volumeData && sysinfoReady">
            <ng-container  *ngFor="let widget of activeMobileWidget">
              <ng-container [ngSwitch]="widget.name.toLowerCase()">

                <widget-sysinfo *ngSwitchCase="'system information'"
                  (back)="onMobileBack()"
                  id="active"
                  [isHA]="isHA"
                  [passive]="false"
                  [widgetSize]="medium">
                </widget-sysinfo>

                <widget-sysinfo *ngSwitchCase="'system information(standby)'"
                  (back)="onMobileBack()"
                  id="passive"
                  [isHA]="isHA"
                  [passive]="true"
                  [widgetSize]="medium">
                </widget-sysinfo>

                <widget-help
                  *ngSwitchCase="'help'"
                  (back)="onMobileBack()"
                  [widgetSize]="medium">
                ></widget-help>

                <widget-cpu *ngSwitchCase="'cpu'"
                  (back)="onMobileBack()"
                  [data]="dataFromConfig(widget)"
                  [cpuModel]="systemInformation.model"
                  [widgetSize]="medium"
                  configurable="false">
                </widget-cpu>

                <widget-memory *ngSwitchCase="'memory'"
                  (back)="onMobileBack()"
                  [data]="dataFromConfig(widget)"
                  [widgetSize]="medium"
                  configurable="false">
                </widget-memory>

                <widget-pool *ngSwitchCase="'pool'"
                  (back)="onMobileBack()"
                  [poolState]="dataFromConfig(widget)"
                  [volumeData]="volumeDataFromConfig(widget)"
                  [widgetSize]="medium"
                  configurable="false">
                </widget-pool>

                <widget-nic *ngSwitchCase="'interface'"
                  (back)="onMobileBack()"
                  [nicState]="dataFromConfig(widget)"
                  [stats]="statsDataEvents"
                  [widgetSize]="medium"
                  configurable="false">
                </widget-nic>

                <widget-network *ngSwitchCase="'network'"
                  (back)="onMobileBack()"
                  [nics]="dataFromConfig(widget)"
                  [stats]="statsDataEvents"
                  [widgetSize]="medium"
                  configurable="false">
                </widget-network>

              </ng-container>
            </ng-container>
          </ng-container>

        </div>
      </div>
    </div>
