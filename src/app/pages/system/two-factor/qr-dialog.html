<h2 mat-dialog-title>{{ 'Scan This QR Code' | translate }}</h2>
<div mat-dialog-content>
  <div id="qr-wrapper">
    <qrcode
      [qrdata]="data.qrInfo"
      [width]="150">
    </qrcode>
  </div>
</div>
<div mat-dialog-actions id="qr-dialog-buttons">
  <button hlmBtn variant="outline" type="button" cdkFocusInitial (click)="onNoClick()">{{ "Close" | translate }}</button>
</div>
