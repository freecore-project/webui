<section id="eula-page" class="fc-page fc-page--capped" aria-labelledby="eula-title">
  <h1 id="eula-title" class="fc-page-title">{{ "EULA" | translate }}</h1>
  <div id="eula" [innerHTML]="eula"></div>
  @if (eula) {
    <div class="buttons" id="button-row">
      <button hlmBtn variant="outline" type="button" id="back-to-support-button" (click)="goToSupport()">
        {{ "Back to Support" | translate }}
      </button>
    </div>
  }
</section>
