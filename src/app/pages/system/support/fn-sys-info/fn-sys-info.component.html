<section id="FN-sys-info-wrapper" aria-labelledby="fn-support-title">
  <h2 id="fn-support-title">{{'System Information' | translate}}</h2>
  <dl class="fc-system-facts">
    <div><dt>{{"OS Version:" | translate}}</dt><dd>{{FN_version}}</dd></div>
    <div><dt>{{"Model:" | translate}}</dt><dd>{{FN_model}}</dd></div>
    <div><dt>{{"Memory:" | translate}}</dt><dd>{{FN_memory}}</dd></div>
    <div><dt>{{"Serial Number:" | translate}}</dt><dd>{{FN_serial}}</dd></div>
  </dl>
</section>
<section id="fn-instructions" [innerHTML]="FN_instructions | translate"></section>
