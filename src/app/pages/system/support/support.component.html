<!-- the internal development record: no ticket-submission surface. Everything this page offered
     below the system information -- the Jira form, Proactive Support, the
     enterprise contract panels and the iX product image -- posted to
     support-proxy.ixsystems.com, optionally with a full system debug. This fork
     is CORE-only and is not supported by iXsystems, so the page is now system
     information plus a link to our own tracker (see helptext FN_instructions).
     Rendered unconditionally: product_type comes from localStorage and is
     undefined on a browser that has never logged in, which used to fall through
     to the ENTERPRISE branch -- the same latent bug fixed in the internal development record. -->
<mat-card class="form-card">
  <div class="mat-content" fxLayout="column">
    <div id="top-row" class="container" fxLayout="row wrap">
      <div id="top-left" fxFlex="100">
        <app-fn-sys-info
          [FN_version]='FN_version'
          [FN_model]="FN_model"
          [FN_memory]="FN_memory"
          [FN_serial]="FN_serial"
          [FN_instructions]="FN_instructions"
        ></app-fn-sys-info>
      </div>
    </div>
  </div>
</mat-card>
