<div *ngIf="rendered" class="widget stats-widget" [class.xs]="screenType === 'Mobile'">
  <div class="card-container front">
    <mat-card class="front">
      <mat-card-content>
        <mat-toolbar-row>

          <!-- Mobile Only: Exit widget -->
          <button *ngIf="screenType === 'Mobile'" class="mat-card-title-text" mat-icon-button color="default"
            ix-auto ix-auto-type="button" ix-auto-identifier="goBack">
            <mat-icon (click)="goBack()" class="back-arrow">chevron_left</mat-icon>
          </button>

          <h3 class="mat-card-title-text"><div class="card-title-text">{{title | translate}}</div></h3>

          <span *ngIf="ecc" class="widget-chip" matTooltip="{{'ECC memory' | translate}}">ECC</span>

          <div class="controls">
            <button mat-icon-button class="" (click)="router.navigate(['reportsdashboard/memory'])"
              ix-auto ix-auto-type="button" ix-auto-identifier="memoryReports">
              <mat-icon role="img"
                matTooltip="{{'Memory Reports' | translate}}"
                matTooltipPosition="above"
                aria-label="Memory Reports">
                  insert_chart
              </mat-icon>
            </button>
          </div>

        </mat-toolbar-row>

        <div class="mem-body">
          <div class="spinner-wrapper" *ngIf="!memData"><mat-spinner [diameter]="40" style="margin: 0 auto;"></mat-spinner></div>

          <ng-container *ngIf="memData">
            <div class="mem-hero">
              <h1 class="memory-used">
                <span>{{memData.max}}</span>
                <span class="memory-used-units">GiB</span>
              </h1>
              <div class="memory-used-caption">
                {{"total available" | translate}}
              </div>
            </div>

            <div class="mem-bar" role="img" attr.aria-label="{{'Memory composition' | translate}}">
              <div class="mem-seg" *ngFor="let seg of memData.data; let i=index"
                [style.width.%]="segPercent(i)"
                [style.background-color]="trustedSecurity(colorPattern[i])"
                matTooltip="{{seg[0] | translate}}: {{seg[1]}} GiB"
                matTooltipPosition="above"></div>
            </div>

            <!-- Card-spec law 3: the one facts treatment. The composition
                 legend became facts; the meter keeps the color mapping in
                 its tooltips. ARC hit ratio is the reserve fact. -->
            <dl class="mem-facts facts-dl">
              <ng-container *ngFor="let legendItem of memData.data; let i=index">
                <dt>{{legendItem[0] | translate}}</dt>
                <dd>{{legendItem[1]}} GiB</dd>
              </ng-container>
              <ng-container *ngIf="arcHitPct !== null">
                <dt>{{"ARC hit ratio" | translate}}</dt>
                <dd>{{arcHitPct}}%</dd>
              </ng-container>
            </dl>
          </ng-container>
        </div>

      </mat-card-content>
    </mat-card>
  </div>
</div>
