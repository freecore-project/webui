@if (rendered) {
  <section class="widget stats-widget widget-launcher" [class.xs]="screenType === 'Mobile'">
    <div class="card-container front">
      <div class="fc-card front widget-launcher-card-layout">
        <div class="fc-card-content">
          <div class="fc-card-header">
            <h2 class="card-title-text">{{ 'Widgets' | translate }}</h2>
          </div>
          <div class="widget-launcher-list-layout">
            @for (widget of dashState; track widget) {
              @if (widget.rendered) {
                <button #launcherButton type="button" class="widget-launcher-button"
                  [attr.data-widget-key]="widgetKey(widget)" (click)="launchWidget(widget)">
                  <span>{{ widget.name | translate }}@if (widget.identifier && nameFromIdentifier(widget.identifier)) {
                    <span>: {{ nameFromIdentifier(widget.identifier) }}</span>
                  }</span>
                  <mat-icon aria-hidden="true">chevron_right</mat-icon>
                </button>
              }
            }
          </div>
        </div>
      </div>
    </div>
  </section>
}
