<div *ngIf="rendered" class="widget widget-help-strip">
  <mat-card class="strip-card">
      <mat-card-content class="resources-row">
        <span class="resources-title">{{"Resources" | translate}}</span>
        <a href="https://docs.freecore.org/" target="_blank" class="external-link">{{"Documentation" | translate}}</a>
        <a href="https://codeberg.org/freecore/freecore" target="_blank" class="external-link">{{"Community" | translate}}</a>
        <a href="https://codeberg.org/freecore" target="_blank" class="external-link">{{"Open Source" | translate}}</a>
        <span class="resources-spacer"></span>
        <span class="resources-slogan" *ngIf="themeSlogan">Think <span class="blue">correctly</span>.</span>
        <span class="resources-copyright"><a href="https://freecore.org" target="_blank" rel="noopener noreferrer" title="FreeCORE project website" class="project-home-link">freecore.org</a> · &copy; {{copyrightYear}}</span>
      </mat-card-content>
  </mat-card>
</div>
